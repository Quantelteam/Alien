<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFO Arena</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%; overflow: hidden; color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #1b1f4b 0%, #0a0c20 60%, #05060f 100%);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  #menu {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(5, 6, 15, .55); backdrop-filter: blur(3px);
  }
  #menu.hidden { display: none; }
  h1 {
    font-size: clamp(40px, 8vw, 72px); letter-spacing: 6px; font-weight: 800;
    background: linear-gradient(90deg, #5ef2ff, #b86bff, #ff6b9d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(120, 140, 255, .45));
  }
  .sub { opacity: .65; margin-bottom: 10px; }
  input, button {
    width: 280px; padding: 14px 16px; border-radius: 12px; font-size: 17px; font-family: inherit;
    border: 2px solid rgba(160, 175, 255, .35); outline: none;
  }
  input { background: rgba(255, 255, 255, .07); color: #fff; text-align: center; }
  input:focus { border-color: #7f8cff; box-shadow: 0 0 0 4px rgba(127, 140, 255, .2); }
  input::placeholder { color: rgba(255, 255, 255, .4); }
  button {
    cursor: pointer; font-weight: 700; color: #07091a; border: none;
    background: linear-gradient(90deg, #5ef2ff, #9b8cff);
    transition: transform .12s, filter .12s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: default; }
  button small { display: block; font-size: 12px; font-weight: 500; opacity: .75; margin-top: 2px; }
  #playBoss { background: linear-gradient(90deg, #ff9a5e, #ff4f9a); }
  #msg { min-height: 22px; color: #ff9db5; font-size: 14px; text-align: center; max-width: 320px; }
  .hint { opacity: .5; font-size: 14px; margin-top: 8px; text-align: center; line-height: 1.6; }
  kbd {
    background: rgba(255, 255, 255, .12); border-radius: 5px; padding: 1px 7px;
    border: 1px solid rgba(255, 255, 255, .2); font-family: inherit;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <h1>UFO ARENA</h1>
  <div class="sub">Shoot your friends out of the sky</div>
  <input id="nick" maxlength="12" placeholder="Nickname" autocomplete="off" spellcheck="false">
  <button id="play">⚔ Arena <small>players vs players</small></button>
  <button id="playBoss">👾 Boss fight <small>everyone vs the boss</small></button>
  <div id="msg"></div>
  <div class="hint"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> fly &nbsp;·&nbsp; <b>Mouse</b> aim &amp; shoot<br><kbd>Space</kbd> hold &amp; release: charged shot &nbsp;·&nbsp; <kbd>Shift</kbd> dash<br>Grab bonuses. Destroyed? Respawn in 5 seconds.</div>
</div>

<script>
(() => {
'use strict';

// ====== CONFIG ======
// Leave empty if the game is opened from the same server that runs server.js.
// If this page is hosted on Netlify/Vercel, put your game server here, e.g.
// const SERVER_URL = 'wss://my-ufo-arena.onrender.com';
const SERVER_URL = '';

const W = 1600, H = 900;
const INTERP_MS = 80;

const BONUS = {
  speed:  { icon: '⚡',  color: '#ffd23f', label: 'Speed' },
  rapid:  { icon: '🔥', color: '#ff7a3d', label: 'Rapid fire' },
  shield: { icon: '🛡️', color: '#4db8ff', label: 'Shield' },
  triple: { icon: '🔱', color: '#b86bff', label: 'Triple shot' },
  power:  { icon: '💥', color: '#ff3d71', label: 'Power shots' },
  heal:   { icon: '❤️', color: '#3ddc84', label: 'Heal' }
};
const TIMED = ['speed', 'rapid', 'shield', 'triple', 'power'];

// ====== DOM ======
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu');
const nick = document.getElementById('nick');
const playBtn = document.getElementById('play');
const bossBtn = document.getElementById('playBoss');
const modeBtns = [playBtn, bossBtn];
modeBtns.forEach(b => { b.dataset.html = b.innerHTML; });
const msgEl = document.getElementById('msg');

try { nick.value = localStorage.getItem('ufo-nick') || ''; } catch (e) { /* ignore */ }
nick.focus();

// ====== Helpers ======
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hueOf = id => (id * 137.5) % 360;
const setMsg = t => { msgEl.textContent = t || ''; };

let dpr = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.floor(cw * dpr);
  canvas.height = Math.floor(ch * dpr);
  scale = Math.min(cw / W, ch / H);
  ox = (cw - W * scale) / 2;
  oy = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ====== State ======
let ws = null, playing = false, myId = null;
let snaps = [];
let localPos = null;
let particles = [];
const input = { u: false, d: false, l: false, r: false, s: false };
const mouse = { x: 0, y: 0 };
let aim = 0, lastAimT = 0, lastAimSent = 0;
let charge = null;   // { v: 0..1, dir: 1|-1 } while Space is held
let curMode = 'pvp';

const stars = Array.from({ length: 140 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: Math.random() * 1.6 + 0.4, ph: Math.random() * 6.28
}));

// ====== Networking ======
function wsUrl() {
  if (SERVER_URL) return SERVER_URL;
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
}

function join(mode) {
  if (ws) return;
  if (!SERVER_URL && location.protocol === 'file:') {
    setMsg('Open the game from your server, or set SERVER_URL in index.html.');
    return;
  }
  const name = (nick.value.trim() || 'Pilot').slice(0, 12);
  try { localStorage.setItem('ufo-nick', name); } catch (e) { /* ignore */ }

  modeBtns.forEach(b => { b.disabled = true; });
  (mode === 'boss' ? bossBtn : playBtn).textContent = 'Connecting…';
  setMsg('');
  const slow = setTimeout(() => setMsg('Free servers can take up to a minute to wake up…'), 3000);

  let sock;
  try { sock = new WebSocket(wsUrl()); }
  catch (e) { clearTimeout(slow); resetMenu('Could not connect to the server.'); return; }
  ws = sock;
  let opened = false, pending = '';

  sock.onopen = () => { opened = true; sock.send(JSON.stringify({ t: 'join', name, mode })); };

  sock.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === 'init') {
      clearTimeout(slow);
      myId = m.id; playing = true; snaps = []; localPos = null; particles = []; charge = null; playBtn.blur();
      curMode = m.mode || 'pvp';
      menu.classList.add('hidden');
      setMsg('');
    } else if (m.t === 'full') {
      pending = 'This room is full (10/10). Try again in a moment.';
    } else if (m.t === 's') {
      onSnapshot(m);
    }
  };

  sock.onclose = () => {
    clearTimeout(slow);
    const was = playing;
    playing = false; ws = null;
    clearInput();
    resetMenu(pending || (was ? 'Disconnected from server.' : opened ? 'Could not join the game.' : 'Could not connect to the server.'));
  };
  sock.onerror = () => { /* onclose handles it */ };
}

function resetMenu(text) {
  menu.classList.remove('hidden');
  modeBtns.forEach(b => { b.disabled = false; b.innerHTML = b.dataset.html; });
  setMsg(text);
}

function onSnapshot(m) {
  const snap = {
    t: performance.now(),
    players: new Map(m.p.map(p => [p.i, p])),
    bullets: new Map(m.b.map(b => [b.i, b])),
    bonuses: m.o,
    boss: m.bs || null,
    eb: new Map((m.eb || []).map(e => [e[0], e])),
    lz: new Map((m.lz || []).map(l => [l[0], l])),
    zn: m.zn || [],
    sw: new Map((m.sw || []).map(w => [w[0], w])),
    mn: new Map((m.mn || []).map(d => [d[0], d])),
    gw: m.gw || null,
    nv: m.nv || null
  };
  const prev = snaps[snaps.length - 1];
  if (prev) {
    for (const [id, p] of snap.players) {
      const pp = prev.players.get(id);
      if (pp && !pp.d && p.d) explode(pp.x, pp.y, hueOf(id));
    }
  }
  snaps.push(snap);
  if (snaps.length > 12) snaps.shift();
}

function sendMsg(o) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
}
function sendInput() {
  lastAimSent = aim; lastAimT = performance.now();
  sendMsg({ t: 'in', u: input.u, d: input.d, l: input.l, r: input.r, s: input.s, a: Math.round(aim * 100) / 100 });
}
function clearInput() {
  charge = null;
  let changed = false;
  for (const k in input) { if (input[k]) { input[k] = false; changed = true; } }
  if (changed) sendInput();
}

// ====== Input ======
const KEYS = {
  KeyW: 'u', KeyA: 'l', KeyS: 'd', KeyD: 'r',
  ArrowUp: 'u', ArrowLeft: 'l', ArrowDown: 'd', ArrowRight: 'r'
};
window.addEventListener('keydown', (e) => {
  if (!playing) return;
  const k = KEYS[e.code];
  if (!k) return;
  e.preventDefault();
  if (!input[k]) { input[k] = true; sendInput(); }
});
window.addEventListener('keyup', (e) => {
  if (!playing) return;
  const k = KEYS[e.code];
  if (!k) return;
  e.preventDefault();
  if (input[k]) { input[k] = false; sendInput(); }
});
window.addEventListener('blur', clearInput);

function computeAim() {
  if (!localPos) return;
  aim = Math.atan2((mouse.y - oy) / scale - localPos.y, (mouse.x - ox) / scale - localPos.x);
}
function myState() {
  const l = snaps[snaps.length - 1];
  return l ? l.players.get(myId) : null;
}

// mouse: aim + hold left button to shoot
window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', (e) => {
  if (!playing || e.button !== 0) return;
  e.preventDefault();
  mouse.x = e.clientX; mouse.y = e.clientY;
  computeAim();
  input.s = true; sendInput();
});
window.addEventListener('mouseup', (e) => {
  if (e.button === 0 && input.s) { input.s = false; sendInput(); }
});

// Space: hold to charge, release to fire.  Shift: dash.
window.addEventListener('keydown', (e) => {
  if (!playing) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat || charge) return;
    const me = myState();
    if (me && !me.d && me.sc <= 0) charge = { v: 0, dir: 1 };
  } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    e.preventDefault();
    if (!e.repeat) sendMsg({ t: 'dash' });
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && charge) {
    e.preventDefault();
    const v = charge.v;
    charge = null;
    if (playing) sendMsg({ t: 'sp', v });
  }
});

playBtn.addEventListener('click', () => join('pvp'));
bossBtn.addEventListener('click', () => join('boss'));
nick.addEventListener('keydown', (e) => { if (e.key === 'Enter') join('pvp'); });

// ====== Effects ======
function explode(x, y, hue) {
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * 6.283, s = 60 + Math.random() * 280;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0, max: 0.5 + Math.random() * 0.6,
      hue: i % 3 === 0 ? 40 : hue, r: 2 + Math.random() * 3
    });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
  }
  particles = particles.filter(p => p.life < p.max);
}
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = `hsl(${p.hue} 95% 62%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a + 0.5, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ====== Drawing ======
function drawArena(t) {
  ctx.fillStyle = 'rgba(8, 11, 34, .6)';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(140, 160, 255, .06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 100; x < W; x += 100) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 100; y < H; y += 100) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.fillStyle = '#fff';
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t / 700 + s.ph);
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  ctx.shadowColor = '#7f8cff'; ctx.shadowBlur = 16;
  ctx.strokeStyle = 'rgba(127, 140, 255, .8)'; ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, W, H);
  ctx.shadowBlur = 0;
}

function drawBonus(b, t, dim) {
  const def = BONUS[b.k]; if (!def) return;
  const bob = Math.sin(t / 300 + b.i) * 3;
  const pulse = 1 + 0.12 * Math.sin(t / 250 + b.i);
  ctx.save();
  ctx.translate(b.x, b.y + bob);
  const base = dim ? 0.4 : 1;
  ctx.fillStyle = def.color; ctx.globalAlpha = 0.22 * base;
  ctx.beginPath(); ctx.arc(0, 0, 25 * pulse, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.globalAlpha = base; ctx.fillStyle = '#0b0e24'; ctx.strokeStyle = def.color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.font = '18px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(def.icon, 0, 1);
  ctx.restore();
}

function drawBullet(x, y, owner) {
  ctx.save();
  ctx.shadowColor = `hsl(${hueOf(owner)} 95% 60%)`; ctx.shadowBlur = 12;
  ctx.fillStyle = `hsl(${hueOf(owner)} 95% 75%)`;
  ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawBolt(x, y, r, g, owner) {
  const hue = hueOf(owner), dx = Math.cos(g), dy = Math.sin(g);
  ctx.save();
  for (let k = 5; k >= 1; k--) {
    ctx.globalAlpha = 0.5 - k * 0.08;
    ctx.fillStyle = `hsl(${hue} 100% 65%)`;
    ctx.beginPath(); ctx.arc(x - dx * k * r * 0.9, y - dy * k * r * 0.9, r * (1 - k * 0.12), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowColor = `hsl(${hue} 100% 60%)`; ctx.shadowBlur = 28;
  ctx.fillStyle = `hsl(${hue} 100% 70%)`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawChargeBar(x, y) {
  const w = 150, h = 12;
  let by = y - 66;
  if (by < 24) by = y + 42;
  ctx.save();
  ctx.translate(x, by);
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(-w / 2 - 4, -4, w + 8, h + 8);
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, '#4db8ff'); g.addColorStop(0.6, '#ffd23f'); g.addColorStop(1, '#ff3d71');
  ctx.fillStyle = g; ctx.fillRect(-w / 2, 0, w, h);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.strokeRect(w / 2 - w * 0.1, -1, w * 0.1, h + 2);
  const ix = -w / 2 + w * charge.v;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8; ctx.fillStyle = '#fff';
  ctx.fillRect(ix - 2, -5, 4, h + 10);
  ctx.shadowBlur = 0;
  ctx.font = '700 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('POWER ' + Math.round(charge.v * 100) + '%', 0, -9);
  ctx.restore();
}

function drawUfo(x, y, p, isMe, t) {
  const hue = hueOf(p.i);
  const col = `hsl(${hue} 85% 58%)`;
  ctx.save();
  ctx.translate(x, y);

  if (p.iv && Math.floor(t / 70) % 2 === 0) ctx.globalAlpha = 0.35;
  const sh = p.f && p.f.shield;
  if ((sh || p.ps) && (!sh || sh > 1.5 || Math.floor(t / 120) % 2 === 0)) {
    ctx.strokeStyle = `rgba(90, 200, 255, ${0.6 + 0.3 * Math.sin(t / 150)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(90, 200, 255, .1)'; ctx.fill();
  }

  ctx.shadowColor = col; ctx.shadowBlur = 18;
  ctx.fillStyle = 'rgba(190, 235, 255, .9)';
  ctx.beginPath(); ctx.ellipse(0, -4, 11, 11, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 3, 25, 9.5, 0, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;

  for (let i = -1; i <= 1; i++) {
    ctx.fillStyle = (Math.floor(t / 250) + i) % 2 === 0 ? '#fff' : 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(i * 12, 4, 2.2, 0, 6.283); ctx.fill();
  }

  // aim marker
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(Math.cos(p.a) * 31, Math.sin(p.a) * 31, 3.5, 0, 6.283); ctx.fill();

  // hp bar
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(-22, 20, 44, 5);
  ctx.fillStyle = p.h > 50 ? '#3ddc84' : p.h > 25 ? '#ffc53d' : '#ff4d5e';
  ctx.fillRect(-22, 20, 44 * clamp(p.h / 100, 0, 1), 5);

  // name
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = isMe ? '#ffffff' : 'rgba(225, 230, 255, .85)';
  ctx.fillText(p.n, 0, -26);
  ctx.restore();
}

function drawFire(z, t) {
  const x = z[1], y = z[2], r = z[3] * 0.85, pg = z[5];
  const k = 0.4 + 0.6 * pg;
  ctx.save();
  const g = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
  g.addColorStop(0, `rgba(255,200,80,${0.55 * k})`);
  g.addColorStop(0.6, `rgba(255,100,30,${0.4 * k})`);
  g.addColorStop(1, 'rgba(255,60,20,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  for (let i = 0; i < 5; i++) {
    const a = t / 300 + i * 1.26, rr = r * 0.5 * (0.5 + 0.5 * Math.sin(t / 170 + i));
    ctx.fillStyle = `rgba(255,220,120,${0.7 * k})`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, 3 + 3 * Math.sin(t / 110 + i), 0, 6.283); ctx.fill();
  }
  ctx.strokeStyle = `rgba(255,140,50,${0.55 * k})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke();
  ctx.restore();
}

function drawShock(x, y, rad, w) {
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 22;
  ctx.strokeStyle = 'rgba(255,170,70,.75)'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.arc(x, y, Math.max(1, rad), 0, 6.283); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,245,210,.95)'; ctx.lineWidth = w * 0.3;
  ctx.beginPath(); ctx.arc(x, y, Math.max(1, rad), 0, 6.283); ctx.stroke();
  ctx.restore();
}

function drawWell(gw, t) {
  const x = gw[0], y = gw[1], range = gw[2], core = gw[3], st = gw[4];
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = `rgba(190,130,255,${st ? 0.4 : 0.5 + 0.4 * Math.sin(t / 80)})`;
  ctx.lineWidth = 3; ctx.setLineDash([16, 12]);
  ctx.beginPath(); ctx.arc(0, 0, range, 0, 6.283); ctx.stroke();
  ctx.setLineDash([]);
  if (st) {
    ctx.lineWidth = 3;
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = `rgba(200,150,255,${0.35 - k * 0.05})`;
      ctx.beginPath();
      for (let j = 0; j <= 28; j++) {
        const rr = core + (range - core) * (1 - j / 28), a = k * 2.094 + j * 0.2 - t / 350;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
  const cr = core * (st ? 1.6 : 0.8 + 0.2 * Math.sin(t / 90));
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, cr);
  g.addColorStop(0, '#000'); g.addColorStop(0.6, 'rgba(20,0,40,.95)'); g.addColorStop(1, 'rgba(160,80,255,0)');
  ctx.fillStyle = g; ctx.shadowColor = '#a050ff'; ctx.shadowBlur = st ? 30 : 10;
  ctx.beginPath(); ctx.arc(0, 0, cr, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawDrone(x, y, hr, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t / 400);
  ctx.fillStyle = '#2b2145'; ctx.strokeStyle = '#ff5c8a'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    if (i === 0) ctx.moveTo(Math.cos(a) * 17, Math.sin(a) * 17); else ctx.lineTo(Math.cos(a) * 17, Math.sin(a) * 17);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.rotate(-t / 400);
  ctx.shadowColor = '#ff3d5e'; ctx.shadowBlur = 12; ctx.fillStyle = '#ff3d5e';
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;
  if (hr < 1) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(-14, -29, 28, 4);
    ctx.fillStyle = '#ff6b8b'; ctx.fillRect(-14, -29, 28 * hr, 4);
  }
  ctx.restore();
}

function drawNova(nv, t) {
  if (nv.f <= 0) return;
  ctx.fillStyle = 'rgba(25,0,45,.45)'; ctx.fillRect(0, 0, W, H);
  for (const q of nv.s) {
    const g = ctx.createRadialGradient(q[0], q[1], q[2] * 0.2, q[0], q[1], q[2]);
    g.addColorStop(0, 'rgba(120,255,180,.55)'); g.addColorStop(1, 'rgba(120,255,180,.12)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(q[0], q[1], q[2], 0, 6.283); ctx.fill();
    ctx.strokeStyle = `rgba(150,255,200,${0.6 + 0.3 * Math.sin(t / 120)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(q[0], q[1], q[2], 0, 6.283); ctx.stroke();
  }
}

function drawZone(z, t) {
  if (z[4] === 2) { drawFire(z, t); return; }
  const x = z[1], y = z[2], r = z[3], ph = z[4], pg = z[5];
  ctx.save();
  if (ph === 0) {
    ctx.fillStyle = `rgba(255,60,90,${0.06 + 0.16 * pg})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = `rgba(255,90,110,${0.5 + 0.4 * Math.sin(t / 60)})`;
    ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,200,200,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r * pg, 0, 6.283); ctx.stroke();
  } else {
    ctx.fillStyle = `rgba(255,230,230,${0.9 * (1 - pg)})`;
    ctx.shadowColor = '#ff3d5e'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(x, y, r * (1 + 0.15 * pg), 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function drawLaser(x1, y1, x2, y2, w, ph, t) {
  ctx.save();
  ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  if (ph === 0) {
    ctx.strokeStyle = 'rgba(255,80,110,.08)'; ctx.lineWidth = w; ctx.stroke();
    ctx.strokeStyle = `rgba(255,80,110,${0.35 + 0.35 * Math.abs(Math.sin(t / 90))})`;
    ctx.lineWidth = 3; ctx.setLineDash([16, 10]); ctx.stroke();
  } else {
    ctx.shadowColor = '#ff3d5e'; ctx.shadowBlur = 24;
    ctx.strokeStyle = 'rgba(255,60,100,.6)'; ctx.lineWidth = w; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = w * 0.4; ctx.stroke();
  }
  ctx.restore();
}

function drawBoss(bs, t, tx, ty) {
  const ph = bs.ph || 0, rage = ph > 0, hue = [275, 350, 25][ph];
  const r = bs.r * (1 + 0.03 * Math.sin(t / 220));
  ctx.save();
  ctx.translate(bs.x, bs.y);
  if (bs.s) ctx.globalAlpha = 0.35;

  ctx.save();
  ctx.rotate(t / 1800 * (rage ? 2 : 1));
  ctx.fillStyle = `hsl(${hue} 70% 35%)`;
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath(); ctx.moveTo(r * 0.85, -14); ctx.lineTo(r * 1.25, 0); ctx.lineTo(r * 0.85, 14); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  if (ph > 0) {
    ctx.save(); ctx.rotate(-t / 900); ctx.globalAlpha = 0.6;
    ctx.strokeStyle = `hsl(${hue} 100% 65%)`; ctx.lineWidth = 3; ctx.setLineDash([18, 12]);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.55, 0, 6.283); ctx.stroke(); ctx.restore();
  }
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, `hsl(${hue} 80% 55%)`); g.addColorStop(1, `hsl(${hue} 80% 18%)`);
  ctx.shadowColor = `hsl(${hue} 100% 60%)`; ctx.shadowBlur = 40;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.55, r * 0.38, 0, 0, 6.283); ctx.fill();
  const ang = Math.atan2(ty - bs.y, tx - bs.x), d = r * 0.16;
  ctx.fillStyle = rage ? '#ff1744' : '#3a1480';
  ctx.beginPath(); ctx.arc(Math.cos(ang) * d, Math.sin(ang) * d, r * 0.21, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(Math.cos(ang) * d * 1.3, Math.sin(ang) * d * 1.3, r * 0.09, 0, 6.283); ctx.fill();

  if (bs.hf) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill(); }
  ctx.restore();
}

function drawEnemyBullet(x, y, r, kind) {
  const c = kind === 1 ? '190,110,255' : '255,70,110';
  ctx.fillStyle = `rgba(${c},.25)`;
  ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, 6.283); ctx.fill();
  ctx.fillStyle = `rgb(${c})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, 6.283); ctx.fill();
}

function drawBossLayer(t, a, b, f, latest) {
  if (latest.nv) drawNova(latest.nv, t);
  for (const z of latest.zn) drawZone(z, t);

  for (const L of b.lz.values()) {
    const pa = a.lz.get(L[0]);
    if (pa) drawLaser(lerp(pa[1], L[1], f), lerp(pa[2], L[2], f), lerp(pa[3], L[3], f), lerp(pa[4], L[4], f), L[5], L[6], t);
    else drawLaser(L[1], L[2], L[3], L[4], L[5], L[6], t);
  }

  if (latest.gw) drawWell(latest.gw, t);
  for (const sw of b.sw.values()) { const pa = a.sw.get(sw[0]); drawShock(sw[1], sw[2], pa ? lerp(pa[3], sw[3], f) : sw[3], sw[4]); }

  const bb = latest.boss, ba = a.boss;
  const bs = Object.assign({}, bb);
  if (ba && b.boss) { bs.x = lerp(ba.x, b.boss.x, f); bs.y = lerp(ba.y, b.boss.y, f); }
  let tx = bs.x, ty = H, best = 1e9;
  for (const p of latest.players.values()) {
    if (p.d) continue;
    const d = Math.hypot(p.x - bs.x, p.y - bs.y);
    if (d < best) { best = d; tx = p.x; ty = p.y; }
  }
  drawBoss(bs, t, tx, ty);

  for (const d of b.mn.values()) {
    const pa = a.mn.get(d[0]);
    drawDrone(pa ? lerp(pa[1], d[1], f) : d[1], pa ? lerp(pa[2], d[2], f) : d[2], d[3], t);
  }

  for (const e of b.eb.values()) {
    const pa = a.eb.get(e[0]);
    drawEnemyBullet(pa ? lerp(pa[1], e[1], f) : e[1], pa ? lerp(pa[2], e[2], f) : e[2], e[3], e[4]);
  }
}

function drawWorld(t, dt) {
  const latest = snaps[snaps.length - 1];
  const me = latest.players.get(myId);

  // smooth local ship (shown close to real-time)
  if (me) {
    if (!localPos || me.d || Math.hypot(me.x - localPos.x, me.y - localPos.y) > 250) {
      localPos = { x: me.x, y: me.y };
    } else {
      const k = 1 - Math.exp(-dt * 20);
      localPos.x += (me.x - localPos.x) * k;
      localPos.y += (me.y - localPos.y) * k;
    }
  }

  // interpolation for everything else
  const rt = t - INTERP_MS;
  let i = snaps.length - 1;
  while (i > 0 && snaps[i].t > rt) i--;
  const a = snaps[i], b = snaps[Math.min(i + 1, snaps.length - 1)];
  const f = b.t > a.t ? clamp((rt - a.t) / (b.t - a.t), 0, 1) : 0;

  if (latest.boss) drawBossLayer(t, a, b, f, latest);
  const busy = !!(me && me.f && TIMED.some(k => me.f[k]));
  for (const bo of latest.bonuses) drawBonus(bo, t, busy);

  for (const bu of b.bullets.values()) {
    const pa = a.bullets.get(bu.i);
    const bx = pa ? lerp(pa.x, bu.x, f) : bu.x, by = pa ? lerp(pa.y, bu.y, f) : bu.y;
    if (bu.s) drawBolt(bx, by, bu.s, bu.g, bu.o); else drawBullet(bx, by, bu.o);
  }

  for (const pb of b.players.values()) {
    const isMe = pb.i === myId;
    const p = isMe ? me : (latest.players.get(pb.i) || pb);
    if (!p || p.d) continue;
    let x, y;
    if (isMe && localPos) { x = localPos.x; y = localPos.y; }
    else {
      const pa = a.players.get(pb.i);
      if (pa && !pa.d && Math.hypot(pb.x - pa.x, pb.y - pa.y) < 300) { x = lerp(pa.x, pb.x, f); y = lerp(pa.y, pb.y, f); }
      else { x = pb.x; y = pb.y; }
    }
    if (p.ds) particles.push({ x, y, vx: 0, vy: 0, life: 0, max: 0.35, hue: hueOf(p.i), r: 9 });
    drawUfo(x, y, isMe ? Object.assign({}, p, { a: aim }) : p, isMe, t);
    if (isMe && charge) drawChargeBar(x, y);
  }
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(6, 8, 26, .6)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(140, 160, 255, .25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w, h);
}

function drawBossOverlays(latest, me) {
  const bs = latest.boss, nv = latest.nv;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (me && me.cf) {
    ctx.fillStyle = 'rgba(140,60,220,.16)'; ctx.fillRect(0, 0, W, H);
    ctx.font = '800 26px system-ui, "Segoe UI Emoji", sans-serif'; ctx.fillStyle = '#e0b8ff';
    ctx.fillText('🌀 CONTROLS INVERTED', W / 2, H - 120);
  }
  if (nv && nv.f > 0) {
    ctx.font = '800 34px system-ui, sans-serif'; ctx.fillStyle = '#9dffc8';
    ctx.fillText('STAND IN THE LIGHT!', W / 2, 150);
    ctx.font = '800 64px system-ui, sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(String(Math.ceil(nv.f / 1000)), W / 2, 220);
  }
  if (nv && nv.fl > 0) { ctx.fillStyle = `rgba(255,255,255,${0.85 * nv.fl / 700})`; ctx.fillRect(0, 0, W, H); }
  if (bs.bn && bs.bl > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, bs.bl / 600);
    ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 30;
    ctx.font = '900 60px system-ui, sans-serif'; ctx.fillStyle = '#ff6b8b';
    ctx.fillText(bs.bn, W / 2, H / 2 - 150);
    ctx.restore();
  }
}

function drawBossHud(bs) {
  const w = 560, x = (W - w) / 2, y = 22;
  panel(x - 12, y - 6, w + 24, 62);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillStyle = bs.ph > 0 ? '#ff7a8a' : '#d6b8ff';
  ctx.fillText('VOID WARDEN' + (bs.s ? '' : ['', '  —  ENRAGED', '  —  FINAL FORM'][bs.ph || 0]), x, y + 12);
  ctx.textAlign = 'right'; ctx.fillStyle = '#cfd6ff';
  ctx.fillText(Math.ceil(bs.h * 100) + '%', x + w, y + 12);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x, y + 20, w, 14);
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#b86bff'); g.addColorStop(1, '#ff4d7a');
  ctx.fillStyle = g; ctx.fillRect(x, y + 20, w * clamp(bs.h, 0, 1), 14);
  ctx.textAlign = 'center';
  if (bs.at && !bs.s) {
    ctx.font = '600 13px system-ui, "Segoe UI Emoji", sans-serif';
    ctx.fillStyle = 'rgba(255,200,210,.9)';
    ctx.fillText('⚠ ' + bs.at, W / 2, y + 50);
  }
  if (bs.s) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, H / 2 - 120, W, 200);
    ctx.fillStyle = '#ffd23f'; ctx.font = '800 56px system-ui, sans-serif';
    ctx.fillText('BOSS DEFEATED!', W / 2, H / 2 - 40);
    ctx.font = '600 22px system-ui, sans-serif';
    if (bs.mv) { ctx.fillStyle = '#e8ecff'; ctx.fillText('MVP: ' + bs.mv, W / 2, H / 2); }
    ctx.fillStyle = '#9fb0ff';
    ctx.fillText('Next fight in ' + Math.max(1, Math.ceil(bs.vl / 1000)) + 's', W / 2, H / 2 + 38);
  }
}

function drawAbility(x, y, key, label, rem, total, color) {
  const w = 140, h = 50;
  panel(x, y, w, h);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.font = '700 11px system-ui, sans-serif';
  ctx.fillStyle = color; ctx.fillText(key, x + 12, y + 18);
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.fillStyle = '#e8ecff'; ctx.fillText(label, x + 12, y + 36);
  const ready = rem <= 0;
  ctx.textAlign = 'right'; ctx.font = '700 14px system-ui, sans-serif';
  ctx.fillStyle = ready ? color : 'rgba(207,214,255,.7)';
  ctx.fillText(ready ? 'READY' : Math.ceil(rem / 1000) + 's', x + w - 12, y + 18);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x + 12, y + h - 8, w - 24, 4);
  ctx.fillStyle = color;
  ctx.fillRect(x + 12, y + h - 8, (w - 24) * (ready ? 1 : clamp(1 - rem / total, 0, 1)), 4);
}

function drawHud() {
  const latest = snaps[snaps.length - 1];
  const me = latest.players.get(myId);
  ctx.textBaseline = 'alphabetic';

  // my status
  if (me) {
    const effects = TIMED.filter(k => me.f && me.f[k]);
    panel(20, 20, 250, 64 + effects.length * 26);
    ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#cfd6ff';
    ctx.fillText('HP', 34, 44);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(62, 32, 192, 14);
    ctx.fillStyle = me.h > 50 ? '#3ddc84' : me.h > 25 ? '#ffc53d' : '#ff4d5e';
    ctx.fillRect(62, 32, 192 * clamp(me.h / 100, 0, 1), 14);
    ctx.fillStyle = '#cfd6ff';
    ctx.fillText((curMode === 'boss' ? 'Damage: ' : 'Kills: ') + me.k, 34, 70);

    let y = 94;
    for (const k of effects) {
      const def = BONUS[k], rem = me.f[k];
      ctx.font = '14px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(def.icon + ' ' + def.label, 34, y);
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(150, y - 11, 104, 8);
      ctx.fillStyle = def.color; ctx.fillRect(150, y - 11, 104 * clamp(rem / 7, 0, 1), 8);
      y += 26;
    }
  }

  // scoreboard
  const list = [...latest.players.values()].sort((p, q) => q.k - p.k || p.n.localeCompare(q.n));
  const pw = 220, ph = 40 + list.length * 22;
  const px = W - pw - 20;
  panel(px, 20, pw, ph);
  ctx.font = '600 12px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(207,214,255,.7)';
  ctx.fillText('PLAYERS ' + list.length + '/10', px + 14, 42);
  ctx.textAlign = 'right'; ctx.fillText(curMode === 'boss' ? 'DMG' : 'KILLS', px + pw - 14, 42); ctx.textAlign = 'left';
  let y = 66;
  for (const p of list) {
    ctx.fillStyle = `hsl(${hueOf(p.i)} 85% 58%)`;
    ctx.beginPath(); ctx.arc(px + 20, y - 5, 5, 0, 6.283); ctx.fill();
    ctx.font = (p.i === myId ? '700' : '500') + ' 14px system-ui, sans-serif';
    ctx.fillStyle = p.i === myId ? '#fff' : 'rgba(225,230,255,.8)';
    ctx.textAlign = 'left'; ctx.fillText(p.n, px + 34, y);
    ctx.textAlign = 'right'; ctx.fillText(String(p.k), px + pw - 14, y);
    y += 22;
  }

  if (latest.boss) { drawBossHud(latest.boss); drawBossOverlays(latest, me); }

  // controls hint
  ctx.textAlign = 'center';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(207,214,255,.4)';
  ctx.fillText('W A S D — fly   ·   Mouse — aim & shoot', W / 2, H - 16);
  if (me) {
    drawAbility(W / 2 - 150, H - 78, 'SPACE', 'Charged shot', me.sc, 20000, '#ff6b9d');
    drawAbility(W / 2 + 10, H - 78, 'SHIFT', 'Dash', me.dc, 5000, '#5ef2ff');
  }

  // death overlay
  if (me && me.d) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff6b8b';
    ctx.font = '800 54px system-ui, sans-serif';
    ctx.fillText('DESTROYED', W / 2, H / 2 - 20);
    ctx.fillStyle = '#e8ecff';
    ctx.font = '600 22px system-ui, sans-serif';
    if (me.kb) ctx.fillText('by ' + me.kb, W / 2, H / 2 + 14);
    ctx.fillStyle = '#9fb0ff';
    ctx.fillText('Respawn in ' + Math.max(1, Math.ceil(me.rs / 1000)) + 's', W / 2, H / 2 + 52);
  }
}

// ====== Main loop ======
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);

  const lastSnap = snaps[snaps.length - 1];
  const skMs = playing && lastSnap && lastSnap.boss ? lastSnap.boss.sk : 0;
  ctx.save();
  if (skMs > 0) { const amp = Math.min(12, skMs / 70); ctx.translate((Math.random() - 0.5) * amp * 2, (Math.random() - 0.5) * amp * 2); }
  drawArena(now);
  updateParticles(dt);
  const live = playing && snaps.length > 0;
  if (live) {
    const me = myState();
    if (me && me.d) charge = null;
    if (charge) {
      charge.v += charge.dir * (0.6 + 1.8 * charge.v) * dt;   // faster near the powerful end
      if (charge.v >= 1) { charge.v = 1; charge.dir = -1; }
      else if (charge.v <= 0) { charge.v = 0; charge.dir = 1; }
    }
    computeAim();
    const dA = Math.atan2(Math.sin(aim - lastAimSent), Math.cos(aim - lastAimSent));
    if (now - lastAimT >= 33 && Math.abs(dA) > 0.02) sendInput();
    drawWorld(now, dt);
  }
  drawParticles();
  ctx.restore();
  if (live) drawHud();
}
requestAnimationFrame(frame);
})();
</script>
